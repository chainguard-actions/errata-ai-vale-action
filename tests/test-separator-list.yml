name: Test separator-delimited file list
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: "tests/fixtures/vale/clean/clean.md,tests/fixtures/vale/bad/bad.md,"
          separator: ","
          config: tests/fixtures/vale/.vale.ini
          sync: "false"
          reporter: local
          filter_mode: nofilter
          fail_on_error: "true"
      - name: Assert action failed (bad file from list was linted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since bad.md is in the list"
            exit 1
          fi
          echo "PASS"
