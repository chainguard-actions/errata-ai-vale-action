name: Test lint errors without fail_on_error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          files: tests/fixtures/docs/bad.md
          reporter: local
          filter_mode: nofilter
          fail_on_error: "false"
          vale_flags: "--config=tests/fixtures/vale/.vale.ini"
      - name: Assert action succeeded despite lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when fail_on_error=false"
            exit 1
          fi
          echo "PASS"
