name: Test JSON array files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          files: '["tests/fixtures/docs/clean.md", "tests/fixtures/docs/clean2.md"]'
          reporter: local
          filter_mode: nofilter
          fail_on_error: "true"
          vale_flags: "--config=tests/fixtures/vale/.vale.ini"
      - name: Assert success with JSON array of clean files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - id: bad
        uses: .
        continue-on-error: true
        with:
          files: '["tests/fixtures/docs/bad.md"]'
          reporter: local
          filter_mode: nofilter
          fail_on_error: "true"
          vale_flags: "--config=tests/fixtures/vale/.vale.ini"
      - name: Assert failure with JSON array containing bad file
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since bad.md was linted"
            exit 1
          fi
          echo "PASS"
