name: Test lint a folder with error-level alerts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_HEAD_REF: feature-branch
        with:
          files: tests/fixtures/docs-errors
          debug: 'true'
      - name: Assert action ran (errors reported or failed on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (Vale errors and/or sentinel repo Checks API)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: check run created with failure conclusion"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
