name: Test invalid Vale config fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/docs/clean.md
          reporter: local
          filter_mode: nofilter
          vale_flags: "--config=tests/fixtures/vale/does-not-exist.ini"
      - name: Assert action failed on missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with a missing config file"
            exit 1
          fi
          echo "PASS"
