name: Test basic usage (clean docs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          files: tests/fixtures/vale/clean
          config: tests/fixtures/vale/.vale.ini
          sync: "false"
          reporter: local
          filter_mode: nofilter
      - name: Assert action succeeded and vale is installed in tool cache
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          VALE="$(find "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}" -type f -name vale 2>/dev/null | head -n1)"
          echo "vale binary: $VALE"
          if [ -z "$VALE" ]; then
            echo "FAIL: vale binary not found in tool cache"
            exit 1
          fi
          echo "PASS"
