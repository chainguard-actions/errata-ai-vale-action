name: Test pinned Vale version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "3.7.1"
          files: tests/fixtures/docs/clean.md
          reporter: local
          filter_mode: nofilter
          vale_flags: "--config=tests/fixtures/vale/.vale.ini"
      - name: Assert pinned version installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          ACTUAL="$("$HOME/vale" -v)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "3.7.1"; then
            echo "FAIL: expected vale version 3.7.1"
            exit 1
          fi
          echo "PASS"
