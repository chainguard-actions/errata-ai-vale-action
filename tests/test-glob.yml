name: Test glob input filters out files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          files: tests/fixtures/vale/bad
          config: tests/fixtures/vale/.vale.ini
          glob: "*.txt"
          sync: "false"
          reporter: local
          filter_mode: nofilter
          fail_on_error: "true"
      - name: Assert action succeeded (no .txt files linted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since glob excludes the bad markdown file"
            exit 1
          fi
          echo "PASS"
