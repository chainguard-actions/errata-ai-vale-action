name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Vale action with external config
        id: action
        continue-on-error: true
        uses: .
        with:
          config: 'https://raw.githubusercontent.com/errata-ai/vale/v2.15.2/.vale.ini'
          files: all
          debug: 'true'

      - name: Assert action ran with config input
        run: |
          echo "Action completed with config input (exit may be non-zero due to missing GITHUB_TOKEN)"
          echo "PASS: action invoked with config input"
