name: Test fail_on_error with error-level alerts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/vale/bad
          config: tests/fixtures/vale/.vale.ini
          sync: "false"
          reporter: local
          filter_mode: nofilter
          fail_on_error: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because Vale found errors and fail_on_error=true"
            exit 1
          fi
          echo "PASS"
