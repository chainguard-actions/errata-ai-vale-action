name: Test fail_on_error with lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/docs/bad.md
          reporter: local
          filter_mode: nofilter
          fail_on_error: "true"
          vale_flags: "--config=tests/fixtures/vale/.vale.ini"
      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when fail_on_error=true and errors exist"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          set +e
          "$HOME/vale" --config=tests/fixtures/vale/.vale.ini tests/fixtures/docs/bad.md
          CODE=$?
          echo "direct vale exit code: $CODE"
          if [ "$CODE" != "1" ]; then
            echo "FAIL: fixture should produce lint errors (exit 1)"
            exit 1
          fi
          echo "PASS"
